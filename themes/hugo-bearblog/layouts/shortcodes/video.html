<!-- https://dev.to/secure_daily/add-a-video-to-your-hugo-website-104 -->
<div class="video-wrapper">
  <div id="player-wrapper-{{ .Ordinal }}" class="player-wrapper {{ .Get 1 }}"></div>
</div>

<script
type="text/javascript"
src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"
>
</script>

<script>
(function() {
  var playerElement = document.getElementById("player-wrapper-{{ .Ordinal }}");

  var player = new Clappr.Player({
    source: {{ .Get 0 }},
    mute: true,
    width: "100%",
    height: "100%"
  });

  player.attachTo(playerElement);
})();
</script>
